<!DOCTYPE html>
<html>

		<title> Formulario </title>

	<body>
		<h1> Formulario </h1>
		<form id="formulario">
			<label id="labelNombre" for="nombre">Nombre:</label>

		</form>

		<p id="resultado"></p>
		
		<script src="js/scripts.js"></script>
	</body>


</html>
